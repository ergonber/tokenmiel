[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"

# NOTE: `phase2/` directory contains LabRegistry + ILabRegistry + tests reserved for phase 2.
# It is NOT compiled or tested in MVP because it's outside `src/` and `test/`.
# To reactivate, see `phase2/README.md` for instructions.

solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"

verbosity = 2

fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 10000
max_test_rejects = 65536

[invariant]
runs = 50000
depth = 100
fail_on_revert = false
call_override = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[doc]
out = "docs"
title = "tokenization-platform contracts"

[etherscan]
plume = { key = "${PLUME_EXPLORER_API_KEY}" }
polygon = { key = "${POLYGON_EXPLORER_API_KEY}" }

[rpc_endpoints]
plume = "${PLUME_RPC_URL}"
plume_testnet = "${PLUME_TESTNET_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
polygon_amoy = "${POLYGON_AMOY_RPC_URL}"
